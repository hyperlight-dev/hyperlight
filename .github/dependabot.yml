version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
      time: "03:00"
    labels:
      - "kind/dependencies"
  - package-ecosystem: "cargo"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
      time: "03:00"
    labels:
      - "kind/dependencies"
    open-pull-requests-limit: 20
    groups:
      windows:
        patterns:
          - "windows-*"
      mshv:
        patterns:
          - "mshv-*"
      wasm-tools:
        patterns:
          - "wasmparser"
          - "wit-parser"
          - "wit-component"
  - package-ecosystem: "cargo"
    directory: "/src/tests/rust_guests"
    cooldown:
      default-days: 7
    schedule:
      interval: "daily"
      time: "03:00"
    labels:
      - "kind/dependencies"
      - "area/guest"
    open-pull-requests-limit: 5
    groups:
      windows:
        patterns:
          - "windows-*"
