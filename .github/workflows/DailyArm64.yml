# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Daily aarch64

# Full aarch64 coverage runs here on a schedule rather than on every PR, because
# there are only limited aarch64 runners. PRs run a reduced aarch64
# build-test (build, Miri and default Rust tests) and skip aarch64 examples;
# this workflow restores the single-driver tests and the examples once a day.

on:
  schedule:
    - cron: '0 5 * * *' # Runs at 05:00 UTC every day
  workflow_dispatch: # Allow manual triggering

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Build aarch64 guest binaries once and upload them as artifacts for the
  # build-test and run-examples jobs to download.
  build-guests:
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    uses: ./.github/workflows/dep_build_guests.yml
    secrets: inherit
    with:
      arch: arm64
      config: ${{ matrix.config }}

  # Miri on aarch64, which the build-and-test matrix no longer carries. It
  # reads no guest binaries, so it waits for nothing and reports even when the
  # guests fail to build.
  miri:
    uses: ./.github/workflows/dep_miri.yml
    secrets: inherit
    with:
      arch: arm64

  # Full aarch64 build-and-test. full_aarch64: "true" re-enables the
  # single-driver steps that are skipped on PRs.
  build-test:
    needs: build-guests
    permissions:
      # checkout in the called workflow
      contents: read
      # pull goldens from GHCR in the called workflow
      packages: read
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
        hypervisor: [hvf, kvm]
    uses: ./.github/workflows/dep_build_test.yml
    secrets: inherit
    with:
      hypervisor: ${{ matrix.hypervisor }}
      cpu_vendor: apple
      arch: arm64
      config: ${{ matrix.config }}
      full_aarch64: "true"

  run-examples:
    needs: build-guests
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
        hypervisor: [hvf, kvm]
    uses: ./.github/workflows/dep_run_examples.yml
    secrets: inherit
    with:
      hypervisor: ${{ matrix.hypervisor }}
      cpu_vendor: apple
      arch: arm64
      config: ${{ matrix.config }}

  # Fuzz on aarch64. This coverage was removed from PRs in #1594 to conserve the
  # limited arm64 runners, and runs here daily instead. The tracing
  # fuzzers (fuzz_guest_trace, fuzz_guest_estimate_trace_event) are x86_64-only
  fuzzing:
    needs: build-guests
    strategy:
      fail-fast: false
      matrix:
        target: ['fuzz_host_print', 'fuzz_guest_call', 'fuzz_host_call']
    uses: ./.github/workflows/dep_fuzzing.yml
    secrets: inherit
    with:
      target: ${{ matrix.target }}
      arch: arm64
      max_total_time: 300 # 5 minutes in seconds
      timeout_minutes: 35 # 5 minutes fuzzing plus setup and build on slower arm64 runners

  # File (or update) a release-blocking GitHub issue if any job fails. The first
  # label (A-ci-periodics-aarch64) keeps these failures on a dedicated issue.
  # The notifier accepts an existing rollout alias and ensures the issue
  # carries the release blocker label.
  notify-failure:
    runs-on: ubuntu-latest
    needs: [build-guests, miri, build-test, run-examples, fuzzing]
    if: always() && (needs.build-guests.result == 'failure' || needs.miri.result == 'failure' || needs.build-test.result == 'failure' || needs.run-examples.result == 'failure' || needs.fuzzing.result == 'failure')
    permissions:
      # Job-level permissions replace (not merge with) the workflow-level grant,
      # so contents:read must be re-declared for actions/checkout to work.
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Notify Daily aarch64 Failure
        run: ./dev/notify-ci-failure.sh --title="Daily aarch64 Failure - ${{ github.run_number }}" --labels="A-ci-periodics-aarch64,A-ci-periodics,A-testing,S-needs-triage,P-release-blocker"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
