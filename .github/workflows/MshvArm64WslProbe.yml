# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: MSHV ARM64 WSL Probe

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  probe:
    runs-on: ["self-hosted", "Windows", "ARM64", "1ES.Pool=hl-windows-arm"]
    timeout-minutes: 15
    steps:
      - name: Inspect Windows
        run: |
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber,
              OsArchitecture, HyperVisorPresent
          systeminfo |
            Select-String "OS Name","OS Version","System Type","Hyper-V"

      - name: Install WSL
        continue-on-error: true
        run: |
          wsl.exe --install --no-distribution --web-download
          Write-Output "wsl --install exit code: $LASTEXITCODE"

      - name: Inspect WSL
        continue-on-error: true
        run: |
          Get-Command wsl.exe -ErrorAction Continue

          wsl.exe --version
          Write-Output "wsl --version exit code: $LASTEXITCODE"

          wsl.exe --status
          Write-Output "wsl --status exit code: $LASTEXITCODE"

          wsl.exe --list --verbose
          Write-Output "wsl --list exit code: $LASTEXITCODE"

          Get-WindowsOptionalFeature -Online |
            Where-Object FeatureName -In @(
              "Microsoft-Windows-Subsystem-Linux",
              "VirtualMachinePlatform"
            ) |
            Select-Object FeatureName, State

      - name: Inspect WSL Linux
        continue-on-error: true
        run: |
          wsl.exe -e sh -lc @'
          uname -a
          uname -m
          getconf PAGE_SIZE
          if [ -r /proc/config.gz ]; then
            zgrep -E "CONFIG_(HYPERV|MSHV_ROOT|HYPERV_VTL_MODE)=" /proc/config.gz
          else
            echo "/proc/config.gz is unavailable"
          fi
          ls -l /dev/mshv || true
          grep mshv /proc/misc || true
          dmesg 2>/dev/null | grep -iE "mshv|hyper-v|parent|partition" || true
          '@
          Write-Output "WSL Linux probe exit code: $LASTEXITCODE"
