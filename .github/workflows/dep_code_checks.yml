# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Code Checks

on:
  workflow_call:
    inputs:
      docs_only:
        description: Skip building if docs only
        required: false
        type: string
        default: "false"
      prime_cache:
        description: >-
          Run the checks from a cold target and save the caches. Skips them
          when the caches are up to date.
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux-checks:
    if: ${{ inputs.docs_only == 'false' }}
    timeout-minutes: ${{ fromJSON(vars.CODE_CHECKS_JOB_TIMEOUT || '30') }}
    # Spread load across vendor pools: AMD when run_id ends in 0,2,4,6,8, Intel otherwise.
    runs-on: ${{ fromJSON(format('["self-hosted", "Linux", "X64", "1ES.Pool=hld-kvm-{0}", "JobId=linux-checks-{1}-{2}-{3}"]',
        (endsWith(github.run_id, '0') || endsWith(github.run_id, '2') || endsWith(github.run_id, '4') || endsWith(github.run_id, '6') || endsWith(github.run_id, '8')) && 'amd' || 'intel',
        github.run_id,
        github.run_number,
        github.run_attempt)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: hyperlight-dev/ci-setup-workflow@3935a41ca357d6acb4274edc072b75a73a19e2b3  # v2.3.0
        with:
          additional-toolchain-directory: src/tests/rust_guests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check guest toolchains match
        run: |
          guest=$(cd src/tests/rust_guests && rustup show active-toolchain)
          capi=$(cd src/hyperlight_guest_capi && rustup show active-toolchain)
          if [[ "${guest%% *}" != "${capi%% *}" ]]; then
            echo "::error::Guest Rust toolchains must match"
            exit 1
          fi

      # cargo-hyperlight builds a custom sysroot for x86_64-hyperlight-none target.
      # rust-cache cleans "anything not a dependency" from target dirs, removing the sysroot.
      # We cache sysroot separately to avoid rebuilding it (~10s) on every run.
      - name: Restore sysroot cache
        id: sysroot-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src/tests/rust_guests/target/sysroot
          key: sysroot-linux-${{ hashFiles('src/tests/rust_guests/rust-toolchain.toml', 'src/hyperlight_guest_capi/rust-toolchain.toml') }}

      # Priming builds cold, so the entry holds only what this commit needs.
      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          prefix-key: v1-rust
          shared-key: "code-checks-linux"
          lookup-only: ${{ inputs.prime_cache }}
          save-if: ${{ inputs.prime_cache }}
          workspaces: |
            . -> target
            src/tests/rust_guests -> target

      - name: Check whether the caches are up to date
        id: prime
        if: inputs.prime_cache
        run: echo "skip=${{ steps.rust-cache.outputs.cache-hit == 'true' && steps.sysroot-cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Ensure up-to-date Cargo.lock
        if: steps.prime.outputs.skip != 'true'
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path src/tests/rust_guests/Cargo.toml --locked

      - name: fmt
        if: steps.prime.outputs.skip != 'true'
        run: just fmt-check

      - name: Install cargo-hyperlight
        if: steps.prime.outputs.skip != 'true'
        run: just ensure-cargo-hyperlight

      - name: clippy exhaustive check (debug)
        if: steps.prime.outputs.skip != 'true'
        run: just clippy-exhaustive debug

      - name: clippy exhaustive check (release)
        if: steps.prime.outputs.skip != 'true'
        run: just clippy-exhaustive release

      - name: Verify MSRV
        if: steps.prime.outputs.skip != 'true'
        run: ./dev/verify-msrv.sh hyperlight-host hyperlight-guest hyperlight-guest-bin hyperlight-common

      - name: Check cargo features compile
        if: steps.prime.outputs.skip != 'true'
        run: just check

      - name: Check compilation with no default features
        if: steps.prime.outputs.skip != 'true'
        run: |
          just test-compilation-no-default-features debug
          just test-compilation-no-default-features release

      - name: Run loom concurrency tests
        if: steps.prime.outputs.skip != 'true'
        run: just test-loom

      # A job step, not a post-job step, so the save runs before rust-cache's
      # post-job cleanup deletes the sysroot.
      - name: Save sysroot cache
        if: ${{ inputs.prime_cache && steps.sysroot-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src/tests/rust_guests/target/sysroot
          key: ${{ steps.sysroot-cache.outputs.cache-primary-key }}

  windows-checks:
    if: ${{ inputs.docs_only == 'false' }}
    timeout-minutes: ${{ fromJSON(vars.CODE_CHECKS_JOB_TIMEOUT || '30') }}
    # Spread load across vendor pools: AMD when run_id ends in 0,2,4,6,8, Intel otherwise.
    runs-on: ${{ fromJSON(format('["self-hosted", "Windows", "X64", "1ES.Pool=hld-win2025-{0}", "JobId=windows-checks-{1}-{2}-{3}"]',
        (endsWith(github.run_id, '0') || endsWith(github.run_id, '2') || endsWith(github.run_id, '4') || endsWith(github.run_id, '6') || endsWith(github.run_id, '8')) && 'amd' || 'intel',
        github.run_id,
        github.run_number,
        github.run_attempt)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: hyperlight-dev/ci-setup-workflow@3935a41ca357d6acb4274edc072b75a73a19e2b3  # v2.3.0
        with:
          additional-toolchain-directory: src/tests/rust_guests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # cargo-hyperlight builds a custom sysroot for x86_64-hyperlight-none target.
      # rust-cache cleans "anything not a dependency" from target dirs, removing the sysroot.
      # We cache sysroot separately to avoid rebuilding it (~10s) on every run.
      - name: Restore sysroot cache
        id: sysroot-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src/tests/rust_guests/target/sysroot
          key: sysroot-windows-${{ hashFiles('src/tests/rust_guests/rust-toolchain.toml', 'src/hyperlight_guest_capi/rust-toolchain.toml') }}

      # Priming builds cold, so the entry holds only what this commit needs.
      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          prefix-key: v1-rust
          shared-key: "code-checks-windows"
          lookup-only: ${{ inputs.prime_cache }}
          save-if: ${{ inputs.prime_cache }}
          workspaces: |
            . -> target
            src/tests/rust_guests -> target

      - name: Check whether the caches are up to date
        id: prime
        if: inputs.prime_cache
        run: echo "skip=${{ steps.rust-cache.outputs.cache-hit == 'true' && steps.sysroot-cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Ensure up-to-date Cargo.lock
        if: steps.prime.outputs.skip != 'true'
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path src/tests/rust_guests/Cargo.toml --locked

      - name: fmt
        if: steps.prime.outputs.skip != 'true'
        run: just fmt-check

      - name: Install cargo-hyperlight
        if: steps.prime.outputs.skip != 'true'
        run: just ensure-cargo-hyperlight

      - name: clippy (debug)
        if: steps.prime.outputs.skip != 'true'
        run: |
          just clippy debug 
          just clippy-guests debug

      - name: clippy (release)
        if: steps.prime.outputs.skip != 'true'
        run: |
          just clippy release 
          just clippy-guests release

      - name: Verify MSRV
        if: steps.prime.outputs.skip != 'true'
        run: ./dev/verify-msrv.sh hyperlight-host hyperlight-guest hyperlight-guest-bin hyperlight-common

      - name: Check cargo features compile
        if: steps.prime.outputs.skip != 'true'
        run: just check

      - name: Check compilation with no default features
        if: steps.prime.outputs.skip != 'true'
        run: |
          just test-compilation-no-default-features debug
          just test-compilation-no-default-features release

      # A job step, not a post-job step, so the save runs before rust-cache's
      # post-job cleanup deletes the sysroot.
      - name: Save sysroot cache
        if: ${{ inputs.prime_cache && steps.sysroot-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            src/tests/rust_guests/target/sysroot
          key: ${{ steps.sysroot-cache.outputs.cache-primary-key }}
