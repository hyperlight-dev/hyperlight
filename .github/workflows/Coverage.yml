# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Weekly Coverage

on:
  pull_request:
    paths:
      - .github/workflows/Coverage.yml
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  coverage:
    timeout-minutes: ${{ fromJSON(vars.COVERAGE_JOB_TIMEOUT || '90') }}
    strategy:
      fail-fast: false
      matrix:
        hypervisor: [kvm]
        # Spread load across vendor pools: AMD when run_id ends in 0,2,4,6,8, Intel otherwise.
        cpu: ${{ fromJSON((endsWith(github.run_id, '0') || endsWith(github.run_id, '2') || endsWith(github.run_id, '4') || endsWith(github.run_id, '6') || endsWith(github.run_id, '8')) && '["amd"]' || '["intel"]') }}
    runs-on: ${{ fromJson(
        format('["self-hosted", "Linux", "X64", "1ES.Pool=hld-{0}-{1}"]',
          matrix.hypervisor,
          matrix.cpu)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: hyperlight-dev/ci-setup-workflow@3935a41ca357d6acb4274edc072b75a73a19e2b3  # v2.3.0
        with:
          additional-toolchain-directory: src/tests/rust_guests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build guest binaries
        run: just guests

      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly-2026-09-22
          rustup component add llvm-tools --toolchain nightly-2026-09-22

      - name: Generate coverage report
        run: just coverage-ci ${{ matrix.hypervisor }}

      - name: Coverage summary
        run: |
          echo '## Code Coverage Report' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          if [ -f target/coverage/summary.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat target/coverage/summary.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo 'Coverage report was not generated.' >> $GITHUB_STEP_SUMMARY
          fi
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '> For a detailed per-file breakdown, download the **HTML coverage report** from the Artifacts section below.' >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-html-${{ matrix.hypervisor }}-${{ matrix.cpu }}
          path: target/coverage/html/
          if-no-files-found: error

      - name: Upload LCOV coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-lcov-${{ matrix.hypervisor }}-${{ matrix.cpu }}
          path: target/coverage/lcov.info
          if-no-files-found: error

  notify-failure:
    runs-on: ubuntu-latest
    needs: [coverage]
    if: always() && needs.coverage.result == 'failure'
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Notify Coverage Failure
        run: ./dev/notify-ci-failure.sh --title="Weekly Coverage Failure - ${{ github.run_number }}" --labels="area/ci-periodics,area/testing,lifecycle/needs-review"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
