# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Daily Benchmarks

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  actions: read

jobs:
  # Build release guest binaries needed by the benchmark suite.
  build-guests:
    uses: ./.github/workflows/dep_build_guests.yml
    secrets: inherit
    with:
      arch: X64
      config: release

  # Run benchmarks across all hypervisor/cpu combos. The artifacts they leave
  # are the baseline for the pull requests that branch from the commits they
  # measure.
  benchmarks:
    needs: [build-guests]
    strategy:
      fail-fast: true
      matrix:
        arch: [X64]
        hypervisor: ['hyperv-ws2025', mshv3, kvm]
        cpu_vendor: [amd, intel]
    uses: ./.github/workflows/dep_benchmarks.yml
    secrets: inherit
    with:
      hypervisor: ${{ matrix.hypervisor }}
      cpu_vendor: ${{ matrix.cpu_vendor }}
      arch: ${{ matrix.arch }}

  # mshv3 on the MSHV 6.18 kernel pools. A separate job, so a failure here
  # cannot cancel the matrix above.
  benchmarks-mshv-6-18:
    needs: [build-guests]
    strategy:
      fail-fast: false
      matrix:
        cpu_vendor: [amd, intel]
    uses: ./.github/workflows/dep_benchmarks.yml
    secrets: inherit
    with:
      hypervisor: mshv3
      mshv_kernel: "6.18"
      cpu_vendor: ${{ matrix.cpu_vendor }}
      arch: X64

  # File a GitHub issue if any job fails.
  notify-failure:
    runs-on: ubuntu-latest
    needs: [build-guests, benchmarks, benchmarks-mshv-6-18]
    if: always() && (needs.build-guests.result == 'failure' || needs.benchmarks.result == 'failure' || needs.benchmarks-mshv-6-18.result == 'failure')
    permissions:
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Notify Benchmark Failure
        run: ./dev/notify-ci-failure.sh --title="Benchmark Failure - ${{ github.run_number }}" --labels="A-perf,A-testing,S-needs-triage,P-release-blocker"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
