# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build Guests

on:
  workflow_call:
    inputs:
      docs_only:
        description: Skip building if docs only
        required: false
        type: string
        default: "false"
      arch:
        description: CPU architecture for the build (passed from caller matrix)
        required: true
        type: string
      config:
        description: Build configuration (debug or release)
        required: true
        type: string
      ref:
        description: >-
          Commit to build the guests from, as a revision git resolves against
          the checkout. Defaults to the triggering ref.
        required: false
        type: string
        default: ""
      artifact_suffix:
        description: Appended to the artifact names, to keep separate builds apart.
        required: false
        type: string
        default: ""
      prime_cache:
        description: >-
          Build the Rust guests from a cold target and save the caches. Skips
          the build when they are up to date, and skips C guests and uploads.
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-guests:
    if: ${{ inputs.docs_only == 'false' }}
    timeout-minutes: ${{ fromJSON(vars.BUILD_GUESTS_JOB_TIMEOUT || '15') }}
    # Spread load across vendor pools: AMD when run_id ends in 0,2,4,6,8, Intel otherwise.
    runs-on: ${{ fromJson(inputs.arch == 'X64'
        && format('["self-hosted", "Linux", "X64", "1ES.Pool=hld-kvm-{0}", "JobId=build-guests-{1}{5}-{2}-{3}-{4}"]',
            (endsWith(github.run_id, '0') || endsWith(github.run_id, '2') || endsWith(github.run_id, '4') || endsWith(github.run_id, '6') || endsWith(github.run_id, '8')) && 'amd' || 'intel',
            inputs.config,
            github.run_id,
            github.run_number,
            github.run_attempt,
            inputs.artifact_suffix)
        || '["self-hosted", "Linux", "arm64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Resolving a revision needs the history it names.
          fetch-depth: ${{ inputs.ref == '' && 1 || 0 }}

      # The checkout is the merge a pull request's validation builds, so where
      # its two parents branched apart is where the pull request did. On
      # anything but a merge there is no second parent to read, which would
      # build guests for the wrong commit without saying so.
      - name: Check out the commit to build from
        if: inputs.ref != ''
        run: |
          git rev-parse --verify --quiet HEAD^2 >/dev/null || {
            echo "::error::HEAD is not a merge, so ${{ inputs.ref }} is not the branch point"
            exit 1
          }
          git checkout --detach ${{ inputs.ref }}

      - name: Select guest toolchain
        id: guest-toolchain
        run: |
          # Older commits use the root toolchain for both host and guests.
          if [[ -f src/tests/rust_guests/rust-toolchain.toml ]]; then
            echo "directory=src/tests/rust_guests" >> "$GITHUB_OUTPUT"
          else
            echo "directory=" >> "$GITHUB_OUTPUT"
          fi

      - uses: hyperlight-dev/ci-setup-workflow@3935a41ca357d6acb4274edc072b75a73a19e2b3  # v2.3.0
        with:
          additional-toolchain-directory: ${{ steps.guest-toolchain.outputs.directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # cargo-hyperlight builds a custom sysroot for the Hyperlight guest target.
      # rust-cache cleans "anything not a dependency" from target dirs, removing the sysroot.
      # We cache sysroot separately to avoid rebuilding it (~10s) on every run.
      - name: Restore sysroot cache
        id: sysroot-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/tests/rust_guests/target/sysroot
          key: sysroot-linux-${{ inputs.arch }}-${{ inputs.config }}-${{ hashFiles('rust-toolchain.toml', 'src/tests/rust_guests/rust-toolchain.toml', 'src/hyperlight_guest_capi/rust-toolchain.toml') }}

      # Priming builds cold, so the entry holds only what this commit needs.
      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          prefix-key: v1-rust
          shared-key: "guests-${{ inputs.arch }}-${{ inputs.config }}"
          lookup-only: ${{ inputs.prime_cache }}
          save-if: ${{ inputs.prime_cache }}
          workspaces: |
            src/tests/rust_guests -> target
            src/tests/rust_guests -> target-non-pie/build

      - name: Check whether the caches are up to date
        id: prime
        if: inputs.prime_cache
        run: echo "skip=${{ steps.rust-cache.outputs.cache-hit == 'true' && steps.sysroot-cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Install cargo-hyperlight
        if: steps.prime.outputs.skip != 'true'
        run: just ensure-cargo-hyperlight

      - name: Build Rust guests
        if: steps.prime.outputs.skip != 'true'
        run: |
          just build-rust-guests ${{ inputs.config }}
          just move-rust-guests ${{ inputs.config }}

      - name: Build non-PIE Rust guests
        if: steps.prime.outputs.skip != 'true'
        run: |
          just build-rust-guests-non-pie ${{ inputs.config }}
          just move-rust-guests-non-pie ${{ inputs.config }}

      - name: Build C guests
        if: ${{ !inputs.prime_cache }}
        run: |
          just build-c-guests ${{ inputs.config }}
          just move-c-guests ${{ inputs.config }}

      - name: Upload Rust guests
        if: ${{ !inputs.prime_cache }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rust-guests-${{ inputs.arch }}-${{ inputs.config }}${{ inputs.artifact_suffix }}
          path: |
            src/tests/rust_guests/bin/${{ inputs.config }}/
          retention-days: 1
          if-no-files-found: error

      - name: Upload C guests
        if: ${{ !inputs.prime_cache }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: c-guests-${{ inputs.arch }}-${{ inputs.config }}${{ inputs.artifact_suffix }}
          path: src/tests/c_guests/bin/${{ inputs.config }}/
          retention-days: 1
          if-no-files-found: error

      # A job step, not a post-job step, so the save runs before rust-cache's
      # post-job cleanup deletes the sysroot.
      - name: Save sysroot cache
        if: ${{ inputs.prime_cache && steps.sysroot-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: src/tests/rust_guests/target/sysroot
          key: ${{ steps.sysroot-cache.outputs.cache-primary-key }}
