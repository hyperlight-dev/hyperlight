name: Issue Labeler
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Check and Add label
      run: |
        set -euo pipefail
        HAS_STATUS="$(gh issue view ${{ github.event.issue.number }} --json labels \
          -q 'any(.labels[].name; startswith("S-"))')"
        if [[ "$HAS_STATUS" == "false" ]]; then
          gh issue edit ${{ github.event.issue.number }} --add-label S-needs-triage
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
