name: Label Checker
on:
  pull_request:
    branches: main
    types: [opened, labeled, unlabeled, synchronize, reopened]
permissions:
  pull-requests: read
  contents: read

jobs:
  check-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Test label migration offline
        run: python3 dev/test-label-migration.py
      - name: Ensure exactly one category is applied
        run: |
          set -euo pipefail
          PR_NUMBER=${{ github.event.pull_request.number }}
          gh pr view "$PR_NUMBER" --json labels |
            jq -e --slurpfile aliases dev/label-aliases.json -f dev/check-pr-labels.jq
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
