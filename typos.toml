[default]
extend-ignore-identifiers-re = ["Fo", "edn", "ue"]

[files]
extend-exclude = ["**/*.patch", "src/hyperlight_guest_bin/third_party/**/*", "NOTICE.txt"]

[default.extend-words]
# typ is used for field name as type is a reserved keyword
typ="typ"
mmaped="mmapped"
fpr="fpr"
# consts is a module name in stdlib
consts="consts"
# ist is an acronym for Interrupt Stack Table, not a missspelling of its
ist="ist"
finitel="finitel"
# writables as number of writable buffers
writables="writables"
# itme is an acronym used in HVF support for "Into TiMoutable Error"
itme="itme"

[default.extend-identifiers]
# This spelling is part of the mshv-bindings API.
hv_partition_property_code_HV_PARTITION_PROPERTY_GITS_TRANSLATER_BASE_ADDRESS="hv_partition_property_code_HV_PARTITION_PROPERTY_GITS_TRANSLATER_BASE_ADDRESS"
