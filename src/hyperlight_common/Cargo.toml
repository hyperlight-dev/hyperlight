[package]
name = "hyperlight-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
description = """
Hyperlight's components common to host and guest.
"""

[lints]
workspace = true

[dependencies]
arbitrary = {version = "1.4.2", optional = true, features = ["derive"]}
anyhow = { version = "1.0.102", default-features = false }
bitflags = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
bytes = { version = "1", default-features = false }
fixedbitset = { version = "0.5.7", default-features = false }
flatbuffers = { workspace = true }
log = { workspace = true }
smallvec = "1.15.1"
spin = { workspace = true }
thiserror = { version = "2.0.18", default-features = false }
tracing = { workspace = true, optional = true }
tracing-core = { version = "0.1.36", default-features = false }

[features]
default = ["tracing"]
tracing = ["dep:tracing"]
fuzzing = ["dep:arbitrary"]
trace_guest = []
mem_profile = []
std = ["thiserror/std", "log/std", "tracing/std"]

[dev-dependencies]
criterion = { workspace = true }
hyperlight-testing = { workspace = true }
quickcheck = "1.0.3"
rand = { workspace = true }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lib]
bench = false # see https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
doctest = false # reduce noise in test output

[[bench]]
name = "buffer_pool"
harness = false

[[bench]]
name = "virtq_api"
harness = false
