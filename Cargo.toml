[workspace]
resolver = "2"
default-members = [
    "src/hyperlight_common",
    "src/hyperlight_host",
    "src/hyperlight_testing",
]
members = [
    "src/hyperlight_common",
    "src/hyperlight_guest",
    "src/hyperlight_host",
    "src/hyperlight_guest_capi",
    "src/hyperlight_guest_tracing",
    "src/hyperlight_testing",
    "fuzz",
    "src/hyperlight_guest_bin",
    "src/hyperlight_guest_macro",
    "src/hyperlight_libc",
    "src/hyperlight_component_util",
    "src/hyperlight_component_macro",
    "src/trace_dump",
]
# Guests have custom linker flags and live in their own nested workspace,
# so we exclude the whole directory from the host workspace.
exclude = [
    "src/tests/rust_guests",
]

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
homepage = "https://github.com/hyperlight-dev/hyperlight"
repository = "https://github.com/hyperlight-dev/hyperlight"
readme = "README.md"

[workspace.dependencies]
hyperlight-common = { path = "src/hyperlight_common", version = "0.17.0", default-features = false }
hyperlight-host = { path = "src/hyperlight_host", version = "0.17.0", default-features = false }
hyperlight-guest = { path = "src/hyperlight_guest", version = "0.17.0", default-features = false }
hyperlight-guest-bin = { path = "src/hyperlight_guest_bin", version = "0.17.0", default-features = false }
hyperlight-guest-macro = { path = "src/hyperlight_guest_macro", version = "0.17.0", default-features = false }
hyperlight-testing = { path = "src/hyperlight_testing", default-features = false }
hyperlight-guest-tracing = { path = "src/hyperlight_guest_tracing", version = "0.17.0", default-features = false }
hyperlight-libc = { path = "src/hyperlight_libc", version = "0.17.0", default-features = false }
hyperlight-component-util = { path = "src/hyperlight_component_util", version = "0.17.0", default-features = false }
hyperlight-component-macro = { path = "src/hyperlight_component_macro", version = "0.17.0", default-features = false }

# Third-party dependencies shared by two or more workspace member crates.
# Keep this list unified: one version per dependency, chosen from the
# versions already in use unless that breaks a no_std guest crate.
anyhow = "1.0.102"
bindgen = "0.72"
bitflags = "2.13.0"
blake3 = "1.8.5"
bytemuck = "1.24"
cc = "1.2"
criterion = "0.8.2"
env_logger = "0.11.10"
flatbuffers = { version = "25.12.19", default-features = false }
itertools = "0.15.0"
log = "0.4.32"
prettyplease = "0.3.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
rand = "0.10.1"
serde = "1.0"
serde_json = "1.0"
spin = "0.12.0"
syn = "3.0.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-serde = "0.2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# this will generate symbols for release builds
# so is handy for debugging issues in release builds
# to use, run `cargo build --profile=release-with-debug`
[profile.release-with-debug]
inherits = "release"
debug = true
